<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Performance Optimizations -->
    <link rel="modulepreload" href="/src/main.tsx" />
    <link rel="preload" as="style" href="/src/index.css" />
    <meta http-equiv="Cache-Control" content="max-age=31536000" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- Back-Forward Cache Optimization -->
    <meta name="pageType" content="portfolio" />
    <meta name="bfcache-opt-in" content="true" />
    
    <!-- Primary Meta Tags -->
    <title>Hashim Aziz | Project Manager &amp; Scrum Master</title>
    <meta name="title" content="Hashim Aziz | Project Manager &amp; Scrum Master">
    <meta name="description" content="Hashim Aziz, Project Manager &amp; Scrum Master with 5+ years of software delivery experience leading Agile teams of up to 60 people across logistics, financial services and AI projects." />
    <meta name="keywords" content="Hashim Aziz, project manager, scrum master, agile delivery, PMO, portfolio">
    <meta name="author" content="Hashim Aziz">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Hashim Aziz | Project Manager &amp; Scrum Master">
    <meta property="og:description" content="Hashim Aziz, Project Manager &amp; Scrum Master with 5+ years of software delivery experience leading Agile teams of up to 60 people across logistics, financial services and AI projects.">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary">
    <meta property="twitter:title" content="Hashim Aziz | Project Manager &amp; Scrum Master">
    <meta property="twitter:description" content="Hashim Aziz, Project Manager &amp; Scrum Master with 5+ years of software delivery experience leading Agile teams of up to 60 people across logistics, financial services and AI projects.">

    <!-- Theme Color for Mobile Browsers -->
    <meta name="theme-color" content="#F6B17A">
    
    <!-- Accessibility -->
    <meta name="robots" content="index, follow">
    
    <!-- Font Loading Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap">
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
